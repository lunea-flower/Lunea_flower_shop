<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunéa | لونیا</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:25px; }
    .product { background:#fff; border-radius:20px; padding:18px; box-shadow:0 8px 25px rgba(0,0,0,.07); text-align:center; }
    .product img { width:100%; height:220px; object-fit:cover; border-radius:16px; }
    .emoji { font-size:90px; padding:45px 10px; }
    .price { font-weight:bold; margin:12px 0; }
    .order { display:inline-block; padding:10px 18px; border-radius:12px; text-decoration:none; background:#222; color:#fff; }
    .muted { color:#777; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Lunéa | لونیا</h1>
      <p>دسته‌گل‌های مصنوعی، عروسکی و خاص برای هدیه‌های ماندگار 🌷</p>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>محصولات لونیا</h2>
      <p class="muted">محصولات این بخش مستقیماً از Google Sheets خوانده می‌شوند.</p>
      <div id="products" class="products">
        <p>در حال بارگذاری محصولات...</p>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9z3VP62PhTXCAIJb75IrQ2TMD0uWGC5bRt8O3a0nn29qg-NPMrWBKERhKgimIL648xVy9ij6DANfP/pub?output=csv",
      whatsapp: "989000000000"
    };

    const fallbackProducts = [
      {name:"دسته‌گل عروسکی صورتی", description:"فانتزی و ظریف، مناسب هدیه", price:"390000 تومان", image:"🌷", available:"بله"},
      {name:"دسته‌گل خرسی", description:"بامزه و ماندگار", price:"450000 تومان", image:"🧸", available:"بله"},
      {name:"دسته‌گل فانتزی", description:"خاص و دخترانه", price:"350000 تومان", image:"💐", available:"بله"}
    ];

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i=0; i<text.length; i++) {
        const c = text[i], n = text[i+1];
        if (c === '"' && quoted && n === '"') { cell += '"'; i++; }
        else if (c === '"') quoted = !quoted;
        else if (c === ',' && !quoted) { row.push(cell.trim()); cell=""; }
        else if ((c === '\n' || c === '\r') && !quoted) {
          if (c === '\r' && n === '\n') i++;
          row.push(cell.trim()); cell="";
          if (row.some(x => x !== "")) rows.push(row);
          row=[];
        } else cell += c;
      }
      if (cell || row.length) { row.push(cell.trim()); if(row.some(x=>x!=="")) rows.push(row); }
      return rows;
    }

    function render(products) {
      const box = document.getElementById("products");
      const visible = products.filter(p => {
        const a = String(p.available || "").trim().toLowerCase();
        return !["خیر","no","false","0","ناموجود"].includes(a);
      });
      if (!visible.length) {
        box.innerHTML = "<p>فعلاً محصولی برای نمایش وجود ندارد.</p>";
        return;
      }
      box.innerHTML = visible.map(p => {
        const image = String(p.image || "").trim();
        const media = /^https?:\/\//i.test(image)
          ? `<img src="${image}" alt="${p.name || "محصول لونیا"}">`
          : `<div class="emoji">${image || "💐"}</div>`;
        const msg = encodeURIComponent(`سلام لونیا 🌷 من درباره «${p.name || ""}» سوال دارم.`);
        return `<article class="product">
          ${media}
          <h3>${p.name || ""}</h3>
          <p>${p.description || ""}</p>
          <div class="price">${p.price || ""}</div>
          <a class="order" target="_blank" href="https://wa.me/${CONFIG.whatsapp}?text=${msg}">سفارش در واتساپ</a>
        </article>`;
      }).join("");
    }

    async function loadProducts() {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl, {cache:"no-store"});
        if (!res.ok) throw new Error("Sheet unavailable");
        const rows = parseCSV(await res.text());
        if (rows.length < 2) throw new Error("No rows");
        const headers = rows[0].map(h => h.trim().toLowerCase());
        const products = rows.slice(1).map(r => {
          const obj = {};
          headers.forEach((h,i) => obj[h] = r[i] || "");
          return obj;
        }).filter(p => p.name);
        render(products.length ? products : fallbackProducts);
      } catch (e) {
        render(fallbackProducts);
      }
    }
    loadProducts();
  </script>
</body>
</html>
