<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #fff7fa;
      color: #5f4050;

      margin-bottom: 20px;

    h2 {

    textarea {

      border-radius: 10px;

    .logout {

    #imageFile {

    .image-preview {

    }

    .message {

  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h1>🌸 پنل مدیریت لونیا</h1>

    <label for="loginEmail">
      ایمیل
    </label>

    <input
      id="loginEmail"
      type="email"
      autocomplete="username"
      placeholder="ایمیل مدیر"
    >

    <label for="loginPassword">
      رمز عبور
    </label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="رمز عبور"
    >

    <button
      type="button"
      onclick="login()">
      ورود به پنل
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>


  <!-- ADMIN PANEL -->

  <div
    id="adminPanel"
    class="hidden">

    <div class="box">

      <h1>
        🌷 مدیریت فروشگاه لونیا
      </h1>

      <button
        type="button"
        class="logout"
        onclick="logout()">
        خروج از حساب
      </button>

    </div>


    <!-- ADD PRODUCT -->

    <div class="box">

      <h2>
        ➕ افزودن محصول
      </h2>

      <label for="name">
        نام محصول
      </label>

      <input
        id="name"
        type="text"
        placeholder="مثلاً دسته گل عروسکی بانی"
      >


      <label for="price">
        قیمت
      </label>

      <input
        id="price"
        type="text"
        placeholder="مثلاً 3.600.000 تومان"
      >


      <label for="description">
        توضیحات
      </label>

      <textarea
        id="description"
        placeholder="توضیحات محصول..."
      ></textarea>


      <label>
        عکس محصول
      </label>

      <button
        type="button"
        class="image-button"
        onclick="openFilePicker()">
        📷 انتخاب عکس محصول
      </button>

      <input
        id="imageFile"
        type="file"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="imagePreview"
        class="image-preview"
        alt="پیش‌نمایش محصول"
      >


      <button
        type="button"
        onclick="addProduct()">
        🌸 افزودن محصول
      </button>

      <div
        id="productMessage"
        class="message">
      </div>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <h2>
        🛍 محصولات
      </h2>

      <div id="productsList">
        در حال بارگذاری...
      </div>

    </div>

  </div>

</div>


<script>

  /* =================================
     SUPABASE SETTINGS
  ================================= */

  const SUPABASE_URL =
    "https://ajqvnvgjgrxuafxywzcd.supabase.co";

  /*
    فقط مقدار داخل کوتیشن را
    با Publishable Key خودت عوض کن.
  */

  const SUPABASE_KEY =
    "sb_publishable_44yJ8kRkUDBG3Nq6A94N-w_Ih7zLpaJ";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =================================
     ELEMENTS
  ================================= */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginMessage =
    document.getElementById("loginMessage");

  const productMessage =
    document.getElementById("productMessage");


  /* =================================
     LOGIN
  ================================= */

  async function login() {

    loginMessage.textContent = "";
    loginMessage.className = "message";

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    if (!email || !password) {

      showLoginError(
        "لطفاً ایمیل و رمز عبور را وارد کن."
      );

      return;
    }


    try {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (result.error) {

        showLoginError(
          "ورود ناموفق بود: " +
          result.error.message
        );

        return;
      }


      await checkAdmin();

    }

    catch (error) {

      console.error(error);

      showLoginError(
        "خطا در اتصال به Supabase."
      );

    }

  }


  /* =================================
     LOGIN ERROR
  ================================= */

  function showLoginError(message) {

    loginMessage.textContent = message;
    loginMessage.className =
      "message error";

  }


  /* =================================
     CHECK ADMIN
  ================================= */

  async function checkAdmin() {

    try {

      const result =
        await supabaseClient.auth.getUser();


      if (result.error || !result.data.user) {

        showLogin();

        return;
      }


      const user =
        result.data.user;


      const adminResult =
        await supabaseClient
          .from("admins")
          .select("user_id")
          .eq("user_id", user.id)
          .maybeSingle();


      if (adminResult.error) {

        console.error(
          adminResult.error
        );

        showLoginError(
          "خطا در بررسی دسترسی مدیر."
        );

        return;
      }


      if (!adminResult.data) {

        showLoginError(
          "این حساب دسترسی مدیریت ندارد."
        );

        await supabaseClient.auth.signOut();

        return;
      }


      loginBox.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      await loadProducts();

    }

    catch (error) {

      console.error(error);

      showLoginError(
        "خطا در بررسی حساب."
      );

    }

  }


  /* =================================
     SHOW LOGIN
  ================================= */

  function showLogin() {

    loginBox.classList.remove("hidden");

    adminPanel.classList.add("hidden");

  }


  /* =================================
     OPEN FILE PICKER
  ================================= */

  function openFilePicker() {

    document
      .getElementById("imageFile")
      .click();

  }


  /* =================================
     IMAGE PREVIEW
  ================================= */

  function previewImage() {

    const fileInput =
      document.getElementById("imageFile");

    const preview =
      document.getElementById("imagePreview");


    const file =
      fileInput.files[0];


    if (!file) {

      preview.src = "";
      preview.style.display = "none";

      return;
    }


    if (!file.type.startsWith("image/")) {

      alert(
        "لطفاً یک فایل عکس انتخاب کن."
      );

      fileInput.value = "";

      preview.src = "";
      preview.style.display = "none";

      return;
    }


    const imageURL =
      URL.createObjectURL(file);


    preview.src = imageURL;

    preview.style.display = "block";

  }


  /* =================================
     UPLOAD IMAGE
  ================================= */

  async function uploadImage(file) {

    if (!file) {
      return null;
    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    const uploadResult =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadResult.error) {

      throw new Error(
        "آپلود عکس انجام نشد: " +
        uploadResult.error.message
      );

    }


    const publicResult =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(fileName);


    return publicResult.data.publicUrl;

  }


  /* =================================
     ADD PRODUCT
  ================================= */

  async function addProduct() {

    productMessage.textContent = "";
    productMessage.className =
      "message";


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const price =
      document
        .getElementById("price")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const imageFile =
      document
        .getElementById("imageFile")
        .files[0];


    if (!name) {

      showProductError(
        "نام محصول را وارد کن."
      );

      return;
    }


    if (!price) {

      showProductError(
        "قیمت محصول را وارد کن."
      );

      return;
    }


    try {

      productMessage.textContent =
        "در حال ذخیره محصول...";


      let imageURL = null;


      if (imageFile) {

        imageURL =
          await uploadImage(imageFile);

      }


      const insertResult =
        await supabaseClient
          .from("products")
          .insert({
            name: name,
            description: description,
            price: price,
            image: imageURL,
            available: true
          });


      if (insertResult.error) {

        throw new Error(
          insertResult.error.message
        );

      }


      productMessage.textContent =
        "محصول با موفقیت اضافه شد 🌸";

      productMessage.className =
        "message success";


      clearProductForm();


      await loadProducts();

    }

    catch (error) {

      console.error(error);

      showProductError(
        "خطا: " + error.message
      );

    }

  }


  /* =================================
     PRODUCT ERROR
  ================================= */

  function showProductError(message) {

    productMessage.textContent =
      message;

    productMessage.className =
      "message error";

  }


  /* =================================
     CLEAR FORM
  ================================= */

  function clearProductForm() {

    document
      .getElementById("name")
      .value = "";


    document
      .getElementById("price")
      .value = "";


    document
      .getElementById("description")
      .value = "";


    document
      .getElementById("imageFile")
      .value = "";


    const preview =
      document.getElementById(
        "imagePreview"
      );


    preview.src = "";

    preview.style.display =
      "none";

  }


  /* =================================
     LOAD PRODUCTS
  ================================= */

  async function loadProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    list.innerHTML =
      "در حال بارگذاری محصولات...";


    const result =
      await supabaseClient
        .from("products")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (result.error) {

      console.error(result.error);

      list.innerHTML =
        "<p class='error'>خطا در دریافت محصولات.</p>";

      return;
    }


    const products =
      result.data || [];


    if (products.length === 0) {

      list.innerHTML =
        "<p>هنوز محصولی اضافه نشده است.</p>";

      return;
    }


    list.innerHTML = "";


    products.forEach(function(product) {

      const div =
        document.createElement("div");


      div.className =
        "product";


      if (product.image) {

        const img =
          document.createElement("img");

        img.src =
          product.image;

        img.alt =
          product.name || "محصول";

        div.appendChild(img);

      }


      const name =
        document.createElement("div");

      name.className =
        "product-name";

      name.textContent =
        product.name || "";

      div.appendChild(name);


      const price =
        document.createElement("div");

      price.className =
        "product-price";

      price.textContent =
        product.price || "";

      div.appendChild(price);


      if (product.description) {

        const description =
          document.createElement("div");

        description.style.marginTop =
          "8px";

        description.textContent =
          product.description;

        div.appendChild(description);

      }


      const deleteButton =
        document.createElement("button");


      deleteButton.type =
        "button";


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "🗑 حذف محصول";


      deleteButton.onclick =
        function() {

          deleteProduct(
            product.id
          );

        };


      div.appendChild(
        deleteButton
      );


      list.appendChild(div);

    });

  }


  /* =================================
     DELETE PRODUCT
  ================================= */

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "آیا مطمئنی می‌خواهی این محصول حذف شود؟"
      );


    if (!confirmed) {
      return;
    }


    const result =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (result.error) {

      alert(
        "حذف محصول انجام نشد: " +
        result.error.message
      );

      return;
    }


    alert(
      "محصول با موفقیت حذف شد 🌸"
    );


    await loadProducts();

  }


  /* =================================
     LOGOUT
  ================================= */

  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    showLogin();

  }


  /* =================================
     CHECK SESSION
  ================================= */

  window.addEventListener(
    "load",
    async function() {

      const result =
        await supabaseClient
          .auth
          .getSession();


      if (result.data.session) {

        await checkAdmin();

      }
      else {

        showLogin();

      }

    }
  );

</script>

</body>
</html>
```
