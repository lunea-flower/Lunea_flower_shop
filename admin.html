<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت Lunéa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8fb;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #b76e8a;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #b76e8a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #777;
    }

    .delete {
      background: #c85c6b;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
    }

    .product img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      width: 50%;
    }

    #adminPanel {
      display: none;
    }

    #message {
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
      white-space: pre-line;
    }

    #productMessage {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
      white-space: pre-line;
    }

    .image-preview {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
    }

    .file-label {
      display: block;
      background: #f4dce6;
      color: #7d4960;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    #imageFile {
      display: none;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>🌸 مدیریت Lunéa</h1>

  <!-- LOGIN -->

  <div id="loginBox" class="box">

```
<h2>ورود مدیر</h2>

<input
  id="email"
  type="email"
  placeholder="ایمیل">

<input
  id="password"
  type="password"
  placeholder="رمز عبور">

<button onclick="login()">
  ورود
</button>

<div id="message"></div>
```

  </div>

  <!-- ADMIN PANEL -->

  <div id="adminPanel">

```
<!-- ADD PRODUCT -->

<div class="box">

  <h2>➕ افزودن محصول جدید</h2>

  <input
    id="name"
    placeholder="نام محصول">


  <textarea
    id="description"
    placeholder="توضیحات محصول">
  </textarea>


  <input
    id="price"
    placeholder="قیمت، مثلاً 3.600.000 تومان">


  <label class="file-label" for="imageFile">
    📷 انتخاب عکس محصول
  </label>

  <input
    id="imageFile"
    type="file"
    accept="image/*"
    onchange="previewImage()">


  <img
    id="imagePreview"
    class="image-preview">


  <label>
    <input
      id="available"
      type="checkbox"
      checked>

    محصول موجود است
  </label>


  <button onclick="addProduct()">
    🌸 افزودن محصول
  </button>


  <div id="productMessage"></div>

</div>


<!-- PRODUCTS -->

<div class="box">

  <h2>🌷 محصولات فروشگاه</h2>

  <div id="products"></div>

</div>


<!-- LOGOUT -->

<div class="box">

  <button
    class="logout"
    onclick="logout()">

    خروج از حساب

  </button>

</div>
```

  </div>

</div>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://ajqvnvgjgrxuafxywzcd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_44yJ8kRkUDBG3Nq6A94N-w_Ih7zLpaJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document.getElementById("message");


  message.textContent =
    "⏳ در حال ورود...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;

  }


  await checkAdmin();

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (error) {

    document
      .getElementById("message")
      .textContent =
      "❌ خطا:\n" +
      error.message;

    return;

  }


  if (!data) {

    await supabaseClient.auth.signOut();

    document
      .getElementById("message")
      .textContent =
      "❌ این حساب مدیر نیست.";

    return;

  }


  document
    .getElementById("loginBox")
    .style.display = "none";


  document
    .getElementById("adminPanel")
    .style.display = "block";


  loadProducts();

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage() {

  const file =
    document
      .getElementById("imageFile")
      .files[0];


  const preview =
    document
      .getElementById("imagePreview");


  if (!file) {

    preview.style.display = "none";

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    preview.src = e.target.result;

    preview.style.display = "block";

  };


  reader.readAsDataURL(file);

}


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(file) {

  if (!file) {

    return null;

  }


  const fileExtension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    fileExtension;


  const filePath =
    fileName;


  const { error } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


  if (error) {

    throw error;

  }


  const { data } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(filePath);


  return data.publicUrl;

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const price =
    document
      .getElementById("price")
      .value
      .trim();


  const available =
    document
      .getElementById("available")
      .checked;


  const imageFile =
    document
      .getElementById("imageFile")
      .files[0];


  const message =
    document
      .getElementById("productMessage");


  if (!name || !price) {

    alert(
      "نام محصول و قیمت را وارد کن."
    );

    return;

  }


  message.textContent =
    "⏳ در حال افزودن محصول...";


  try {


    let imageUrl = null;


    /* UPLOAD IMAGE */

    if (imageFile) {

      message.textContent =
        "📷 در حال آپلود عکس...";


      imageUrl =
        await uploadImage(imageFile);

    }


    /* INSERT PRODUCT */

    message.textContent =
      "🌸 در حال ذخیره محصول...";


    const { error } =
      await supabaseClient
        .from("products")
        .insert({

          name: name,

          description: description,

          price: price,

          image: imageUrl,

          available: available

        });


    if (error) {

      throw error;

    }


    message.textContent =
      "✅ محصول با موفقیت اضافه شد 🌸";


    /* CLEAR FORM */

    document
      .getElementById("name")
      .value = "";


    document
      .getElementById("description")
      .value = "";


    document
      .getElementById("price")
      .value = "";


    document
      .getElementById("imageFile")
      .value = "";


    document
      .getElementById("available")
      .checked = true;


    const preview =
      document
        .getElementById("imagePreview");


    preview.src = "";

    preview.style.display = "none";


    loadProducts();


  } catch (error) {

    console.error(error);


    message.textContent =
      "❌ خطا:\n" +
      error.message;

  }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "id",
        {
          ascending: false
        }
      );


  const container =
    document.getElementById("products");


  if (error) {

    container.innerHTML =
      "<p>❌ خطا در دریافت محصولات</p>";

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>هنوز محصولی ثبت نشده است.</p>";

    return;

  }


  container.innerHTML = "";


  data.forEach(product => {


    const div =
      document.createElement("div");


    div.className =
      "product";


    div.innerHTML = `

      ${
        product.image
        ?
        `<img
          src="${product.image}"
          alt="">`
        :
        ""
      }


      <h3>
        ${product.name}
      </h3>


      <p>
        ${product.description || ""}
      </p>


      <strong>
        ${product.price}
      </strong>


      <p>
        ${
          product.available
          ? "✅ موجود"
          : "❌ ناموجود"
        }
      </p>


      <div class="actions">

        <button
          onclick="editProduct(${product.id})">

          ✏️ ویرایش

        </button>


        <button
          class="delete"
          onclick="deleteProduct(${product.id})">

          🗑️ حذف

        </button>

      </div>

    `;


    container.appendChild(div);

  });

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "این محصول حذف شود؟"
    )
  ) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "خطا در حذف:\n" +
      error.message
    );

    return;

  }


  loadProducts();

}


/* =========================
   EDIT
========================= */

async function editProduct(id) {

  const newName =
    prompt(
      "نام جدید محصول:"
    );


  if (newName === null) {

    return;

  }


  const newPrice =
    prompt(
      "قیمت جدید:"
    );


  if (newPrice === null) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("products")
      .update({

        name: newName,

        price: newPrice

      })
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "خطا در ویرایش:\n" +
      error.message
    );

    return;

  }


  loadProducts();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();


  location.reload();

}


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
